<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application Tracker</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
    }
    .container {
        max-width: 1200px;
        margin: 35px auto;
        padding: 0 20px;
    }
    h1 { margin-bottom: 6px; }
    .subtitle { color: #6b7280; margin-top: 0; }

    .card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1.5fr 1.5fr 1.5fr 2fr;
        gap: 12px;
    }
    input, select {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        font-size: 14px;
        outline: none;
    }
    input:focus, select:focus {
        border-color: #2563eb;
    }

    button {
        border: 0;
        border-radius: 7px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 600;
    }
    .btn-add { background: #2563eb; color: white; margin-top: 12px; }
    .btn-add:hover { background: #1d4ed8; }
    .btn-export { background: #16a34a; color: white; }
    .btn-export:hover { background: #15803d; }
    .btn-delete { background: #fee2e2; color: #dc2626; }
    .btn-delete:hover { background: #fecaca; }

    .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
    }
    .toolbar-left { display: flex; gap: 10px; align-items: center; }
    .toolbar input { width: 260px; }

    .table-wrap { overflow-x: auto; }
    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 850px;
    }
    th, td {
        padding: 12px 10px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
        vertical-align: middle;
    }
    th {
        background: #f9fafb;
        font-size: 13px;
        color: #4b5563;
    }
    td { font-size: 14px; }
    a {
        color: #2563eb;
        text-decoration: none;
    }
    a:hover { text-decoration: underline; }

    .status {
        padding: 6px 9px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
    }
    .status-option { background: #f3f4f6; }
    .status-applied { background: #dbeafe; color: #1d4ed8; }
    .status-interview { background: #fef3c7; color: #92400e; }
    .status-offer { background: #dcfce7; color: #166534; }
    .status-rejected { background: #fee2e2; color: #991b1b; }

    .empty {
        text-align: center;
        color: #9ca3af;
        padding: 30px;
    }

    .count {
        color: #6b7280;
        font-size: 14px;
    }

    @media (max-width: 1000px) {
        .form-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 800px) {
        .form-grid { grid-template-columns: 1fr; }
        .toolbar { flex-direction: column; align-items: stretch; }
        .toolbar input { width: 100%; }
    }
</style>
</head>

<body>
<div class="container">
    <h1>📋 Job Application Tracker</h1>
    <p class="subtitle">Theo dõi các công việc bạn đã ứng tuyển — dữ liệu được lưu ngay trên trình duyệt.</p>

    <div class="card">
        <h3>Thêm công việc</h3>
        <div class="form-grid">
            <input id="jobName" placeholder="Tên công việc">
            <input id="companyName" placeholder="Tên công ty">
            <input id="jobPosition" placeholder="Vị trí ứng tuyển">
            <input id="jobLink" placeholder="Link ứng tuyển">
            <select id="jobStatus">
                <option value="Chưa ứng tuyển">Chưa ứng tuyển</option>
                <option value="Đã ứng tuyển">Đã ứng tuyển</option>
                <option value="Phỏng vấn">Phỏng vấn</option>
                <option value="Offer">Offer</option>
                <option value="Từ chối">Từ chối</option>
            </select>
            <input id="jobNote" placeholder="Ghi chú">
        </div>
        <button class="btn-add" onclick="addJob()">＋ Thêm công việc</button>
    </div>

    <div class="card">
        <div class="toolbar">
            <div class="toolbar-left">
                <input id="search" placeholder="🔍 Tìm công việc..." oninput="renderJobs()">
                <span class="count" id="count"></span>
            </div>
            <button class="btn-export" onclick="exportExcel()">⬇ Export Excel</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Tên công việc</th>
                        <th>Công ty</th>
                        <th>Vị trí</th>
                        <th>Link ứng tuyển</th>
                        <th>Trạng thái</th>
                        <th>Ghi chú</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="jobTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
let jobs = JSON.parse(localStorage.getItem("jobTrackerData") || "[]");

function saveData() {
    localStorage.setItem("jobTrackerData", JSON.stringify(jobs));
}

function addJob() {
    const name = document.getElementById("jobName").value.trim();
    const company = document.getElementById("companyName").value.trim();
    const position = document.getElementById("jobPosition").value.trim();
    const link = document.getElementById("jobLink").value.trim();
    const status = document.getElementById("jobStatus").value;
    const note = document.getElementById("jobNote").value.trim();

    if (!name) {
        alert("Vui lòng nhập tên công việc.");
        return;
    }

    jobs.push({
        id: Date.now(),
        name,
        company,
        position,
        link,
        status,
        note
    });

    saveData();
    clearForm();
    renderJobs();
}

function clearForm() {
    document.getElementById("jobName").value = "";
    document.getElementById("companyName").value = "";
    document.getElementById("jobPosition").value = "";
    document.getElementById("jobLink").value = "";
    document.getElementById("jobStatus").value = "Chưa ứng tuyển";
    document.getElementById("jobNote").value = "";
}

function deleteJob(id) {
    if (!confirm("Bạn có chắc muốn xóa công việc này?")) return;
    jobs = jobs.filter(job => job.id !== id);
    saveData();
    renderJobs();
}

function updateStatus(id, value) {
    const job = jobs.find(j => j.id === id);
    if (job) {
        job.status = value;
        saveData();
    }
}

function statusClass(status) {
    if (status === "Đã ứng tuyển") return "status-applied";
    if (status === "Phỏng vấn") return "status-interview";
    if (status === "Offer") return "status-offer";
    if (status === "Từ chối") return "status-rejected";
    return "status-option";
}

function escapeHtml(text) {
    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function renderJobs() {
    const tbody = document.getElementById("jobTable");
    const keyword = document.getElementById("search").value.toLowerCase();

    const filtered = jobs.filter(job =>
        job.name.toLowerCase().includes(keyword) ||
        (job.company || "").toLowerCase().includes(keyword) ||
        (job.position || "").toLowerCase().includes(keyword) ||
        job.note.toLowerCase().includes(keyword) ||
        job.status.toLowerCase().includes(keyword)
    );

    document.getElementById("count").textContent = `${filtered.length} công việc`;

    if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty">Chưa có dữ liệu</td></tr>`;
        return;
    }

    tbody.innerHTML = filtered.map((job, index) => `
        <tr>
            <td>${index + 1}</td>
            <td><strong>${escapeHtml(job.name)}</strong></td>
            <td>${escapeHtml(job.company) || "-"}</td>
            <td>${escapeHtml(job.position) || "-"}</td>
            <td>
                ${job.link
                    ? `<a href="${escapeHtml(job.link)}" target="_blank" rel="noopener">Mở link ↗</a>`
                    : "-"}
            </td>
            <td>
                <select class="status ${statusClass(job.status)}"
                        onchange="updateStatus(${job.id}, this.value); this.className='status '+statusClass(this.value)">
                    <option ${job.status === "Chưa ứng tuyển" ? "selected" : ""}>Chưa ứng tuyển</option>
                    <option ${job.status === "Đã ứng tuyển" ? "selected" : ""}>Đã ứng tuyển</option>
                    <option ${job.status === "Phỏng vấn" ? "selected" : ""}>Phỏng vấn</option>
                    <option ${job.status === "Offer" ? "selected" : ""}>Offer</option>
                    <option ${job.status === "Từ chối" ? "selected" : ""}>Từ chối</option>
                </select>
            </td>
            <td>${escapeHtml(job.note) || "-"}</td>
            <td>
                <button class="btn-delete" onclick="deleteJob(${job.id})">Xóa</button>
            </td>
        </tr>
    `).join("");
}

function exportExcel() {
    if (jobs.length === 0) {
        alert("Chưa có dữ liệu để export.");
        return;
    }

    // Xuất file CSV UTF-8 có BOM, Excel mở trực tiếp được.
    const headers = ["STT", "Tên công việc", "Tên công ty", "Vị trí", "Link ứng tuyển", "Trạng thái", "Ghi chú"];
    const rows = jobs.map((job, index) => [
        index + 1,
        job.name,
        job.company || "",
        job.position || "",
        job.link,
        job.status,
        job.note
    ]);

    const csv = [headers, ...rows]
        .map(row => row.map(value => `"${String(value ?? "").replace(/"/g, '""')}"`).join(","))
        .join("\r\n");

    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "job_applications.csv";
    a.click();
    URL.revokeObjectURL(url);
}

renderJobs();
</script>
</body>
</html>
